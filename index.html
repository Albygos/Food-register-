<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mobile Attendance</title>

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#192a43">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Attendance">

<!-- iOS Icons -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
tailwind.config={
  theme:{
    extend:{
      colors:{
        primary:"#192a43",
        accent:"#A88E62",
        success:"#427D56",
        bg:"#f8f7f7"
      },
      fontFamily:{display:["Manrope","sans-serif"]}
    }
  }
}
</script>

<style>
body{font-family:Manrope,sans-serif;}
.hide-scroll::-webkit-scrollbar{display:none;}
/* Smooth loading animation for DETAILS */
.loading-smooth {
  opacity: 0.4;
  transform: translateY(4px);
  filter: blur(1px);
  transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
}

.loaded-smooth {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
  transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
}
</style>
</head>

<body class="bg-bg min-h-screen">

<!-- LOADER -->
<div id="loader" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
  <div class="flex flex-col items-center gap-3">
    <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-semibold text-gray-500">Loading data…</p>
  </div>
</div>

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-bg border-b px-3 py-2 flex justify-between items-center">
  <div>
    <h1 class="text-lg font-bold">Attendance</h1>
    <p class="text-[10px] tracking-widest uppercase text-gray-500">Daily Meal</p>
  </div>
  <button onclick="openModal()" class="material-symbols-outlined text-primary text-xl">
    person_add
  </button>
</header>

<!-- DATE CHIPS -->
<div id="dateChips" class="flex gap-2 overflow-x-auto hide-scroll px-3 py-2"></div>

<main class="px-3 pb-24 space-y-3">

<!-- SUMMARY (same bar, now clickable) -->
<div class="bg-white rounded-xl p-3 shadow border text-xs font-semibold flex justify-between">
  <span id="m-all" onclick="setMeal('all')" class="px-1">ALL</span>
  <span id="m-breakfast" onclick="setMeal('breakfast')">Breakfast <span id="bf">0/0</span></span>
  <span id="m-lunch" onclick="setMeal('lunch')">Lunch <span id="lu">0/0</span></span>
  <span id="m-dinner" onclick="setMeal('dinner')">Dinner <span id="di">0/0</span></span>
</div>

<input id="search" placeholder="Search priest…" class="w-full rounded-xl p-2 text-sm bg-gray-100 outline-none"/>

<div class="flex justify-between items-center">
  <h3 class="text-sm font-bold">DETAILS</h3>
  <span id="count" class="text-[10px] bg-accent/10 text-accent px-2 py-1 rounded"></span>
</div>

<div id="cards" class="space-y-3"></div>
</main>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
  <div class="bg-white rounded-xl w-[90%] max-w-sm p-4 space-y-3">
    <h3 class="font-bold text-sm">Manage Priests</h3>
    <input id="newPriest" placeholder="PRIEST NAME" class="w-full border rounded-lg p-2 text-sm uppercase"/>
    <button onclick="addPriest()" class="w-full bg-primary text-white py-2 rounded-lg text-sm font-bold">
      ADD PRIEST
    </button>
    <div id="priestList" class="space-y-2 max-h-40 overflow-auto"></div>
    <button onclick="closeModal()" class="w-full text-xs text-gray-500">Close</button>
  </div>
</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyB8eIYzMPSgrfVGoQD6HjJklh_HKnr6Un4",
  databaseURL:"https://form-3a4bd-default-rtdb.firebaseio.com"
});
const db=firebase.database();

/* DATE FORMAT (UNCHANGED) */
function localDateKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const da=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}

/* STATE */
let now,today,monthKey,selected;
let priests=[],priestsLoaded=false;
let mealFilter="all";

/* SERVER IST (FIX) */
db.ref(".info/serverTimeOffset").once("value",snap=>{
  const offset=snap.val()||0;
  const utc=Date.now()+offset;
  now=new Date(utc+5.5*3600000);

  today=localDateKey(now);
  monthKey=today.slice(0,7);
  selected=today;

  buildDateChips();
  deleteYesterday();
  loadPriests();
  // DEFAULT underline for ALL
document.getElementById("m-all").style.borderBottom = "2px solid #192a43";
document.getElementById("m-all").style.paddingBottom = "2px";
});


/* DATE CHIPS (SAME LOGIC) */
function buildDateChips(){
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(now.getFullYear(),now.getMonth(),d);
    const key=localDateKey(dt);
    if(key>=today){
      const c=document.createElement("div");
      c.className="h-8 px-3 rounded-lg text-xs font-semibold flex items-center bg-gray-200 whitespace-nowrap";
      c.textContent=key===today?"Today":dt.toLocaleDateString("en",{month:"short",day:"numeric"});
      c.onclick=()=>{selected=key;selectChip(c);loadAttendance();};
      if(key===today)selectChip(c);
      dateChips.appendChild(c);
    }
  }
}

function selectChip(a){
  [...dateChips.children].forEach(x=>x.className="h-8 px-3 rounded-lg text-xs font-semibold flex items-center bg-gray-200 whitespace-nowrap");
  a.className="h-8 px-3 rounded-lg text-xs font-semibold flex items-center bg-primary text-white whitespace-nowrap";
}

/* AUTO DELETE YESTERDAY */
function deleteYesterday(){
  const y=new Date(now.getTime()-86400000);
  db.ref(`attendance/${monthKey}/${localDateKey(y)}`).remove();
}

/* SUMMARY FILTER */
function setMeal(m){
  mealFilter = m;

  ["all","breakfast","lunch","dinner"].forEach(x=>{
    const el = document.getElementById("m-"+x);
    el.style.borderBottom = "0";
    el.style.paddingBottom = "0";
  });

  const active = document.getElementById("m-"+m);
  active.style.borderBottom = "2px solid #192a43";
  active.style.paddingBottom = "2px";

  // 👇 START smooth loading animation
  cards.classList.remove("loaded-smooth");
  cards.classList.add("loading-smooth");

  loadAttendance();
}

/* LOAD PRIESTS */
function loadPriests(){
db.ref("priests").once("value",s=>{
  priests=[];
  priestList.innerHTML="";
  const d=s.val()||{};
  Object.keys(d).forEach(id=>{
    priests.push({id,name:d[id].name});
    priestList.innerHTML+=`
      <div class="flex justify-between items-center border p-2 rounded text-xs">
        <span>${d[id].name}</span>
        <button onclick="deletePriest('${id}')" class="material-symbols-outlined text-red-500 text-sm">delete</button>
      </div>`;
  });
  count.textContent=priests.length+" PRIESTS";
  priestsLoaded=true;
  loadAttendance();
});
}

/* LOAD ATTENDANCE */
function loadAttendance(){
db.ref(`attendance/${monthKey}/${selected}`).once("value",s=>{
  const a=s.val()||{};
  let b=0,l=0,dn=0;
  cards.innerHTML="";
  const q=search.value.toUpperCase();

  priests
  .filter(p=>p.name.includes(q))
  .sort((x,y)=>x.name.localeCompare(y.name))
  .forEach(p=>{
    const m=a[p.id]||{};
    if(m.breakfast)b++;
    if(m.lunch)l++;
    if(m.dinner)dn++;
    if(mealFilter!=="all" && !m[mealFilter])return;

    cards.innerHTML+=`
    <div class="bg-white rounded-xl p-3 border shadow">
      <h4 class="font-bold text-sm mb-2">${p.name}</h4>
      <div class="grid grid-cols-3 gap-2">
        ${btn(p.id,"breakfast","cooking",m.breakfast)}
        ${btn(p.id,"lunch","skillet",m.lunch)}
        ${btn(p.id,"dinner","restaurant",m.dinner)}
      </div>
    </div>`;
  });

  bf.textContent=`${b}/${priests.length}`;
  lu.textContent=`${l}/${priests.length}`;
  di.textContent=`${dn}/${priests.length}`;
  if(priestsLoaded)loader.style.display="none";
  cards.classList.remove("loading-smooth");
cards.classList.add("loaded-smooth");
});
}

function btn(id,meal,icon,on){
return `<button onclick="toggle('${id}','${meal}')" class="py-2 rounded-lg text-xs font-bold flex flex-col items-center ${on?"bg-success text-white":"bg-gray-100 text-gray-500"}">
<span class="material-symbols-outlined text-sm">${icon}</span>${meal.toUpperCase()}</button>`;
}

function toggle(id,meal){
db.ref(`attendance/${monthKey}/${selected}/${id}/${meal}`)
.once("value",s=>db.ref(`attendance/${monthKey}/${selected}/${id}/${meal}`).set(!s.val()).then(loadAttendance));
}

search.oninput=loadAttendance;

/* MODAL */
function openModal(){modal.classList.replace("hidden","flex");}
function closeModal(){modal.classList.replace("flex","hidden");}
function addPriest(){
  const n=newPriest.value.trim().toUpperCase();
  if(!n)return;
  db.ref("priests").push({name:n});
  newPriest.value="";
  loadPriests();
}
function deletePriest(id){
  if(confirm("Delete priest?")){
    db.ref("priests/"+id).remove();
    loadPriests();
  }
}
</script>

  <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
  </script>
</body>
</html>
